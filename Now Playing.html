<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Cinema Dashboard</title>
    <style>
        :root { 
            --bg-color: #000000; 
            --film-detail: rgba(255,255,255,0.4); 
            --header-h: 90px;
            --footer-h: 65px; 
        }
        
        body { 
            margin: 0; 
            background: var(--bg-color); 
            height: 100dvh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            font-family: 'Inter', sans-serif; 
            color: white;
        }

        .auto-hide { opacity: 0; transition: opacity 1.5s ease-in-out; }

        #banner-container { 
            flex: 0 0 var(--header-h);
            width: 100%;
            display: flex; justify-content: center; align-items: center; 
            background-color: #0a0a0a; 
            background-image: 
                linear-gradient(90deg, var(--film-detail) 0px, var(--film-detail) 8px, transparent 8px), 
                linear-gradient(90deg, var(--film-detail) 0px, var(--film-detail) 8px, transparent 8px);
            background-size: 30px 10px, 30px 10px; background-position: 11px 10px, 11px 70px; background-repeat: repeat-x, repeat-x;
            border-top: 1px solid #1a1a1a; border-bottom: 1px solid #1a1a1a; z-index: 10;
        }

        .text-buffer-container { 
            position: relative; width: 100%; height: 60px; 
            display: flex; justify-content: center; align-items: center; 
            cursor: pointer; 
            z-index: 100;
        }
        
        .title-layer { 
            position: absolute; letter-spacing: 8px; font-weight: 800; 
            text-transform: uppercase; font-size: 1rem; color: #ffffff; 
            transition: opacity 1.2s ease-in-out; white-space: nowrap; 
            text-shadow: 0 0 15px rgba(255,255,255,0.2);
        }

        #main-stage {
            flex: 1;
            display: flex; justify-content: center; align-items: center;
            position: relative; z-index: 5;
        }

        #poster-container { 
            position: relative; height: 62vh; width: 42vh; max-height: 75%;
            display: flex; justify-content: center; align-items: center; 
            cursor: pointer; text-decoration: none; 
        }
        
        .poster-layer { position: absolute; height: 100%; width: 100%; border-radius: 4px; transition: opacity 1.5s ease-in-out; box-shadow: 0 0 60px rgba(0,0,0,1); object-fit: cover; }
        .glow { position: absolute; width: 140%; height: 140%; background-size: cover; filter: blur(100px); opacity: 0.25; z-index: 1; transition: opacity 1.5s ease-in-out; }
        
        #footer { 
            flex: 0 0 var(--footer-h);
            width: 100%;
            display: flex; justify-content: space-between; align-items: center; 
            background: rgba(10, 10, 10, 0.9); backdrop-filter: blur(15px); 
            padding: 0 40px; box-sizing: border-box; z-index: 20;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        #year, #clock { width: 120px; font-size: 1.1rem; letter-spacing: 3px; opacity: 0.7; font-weight: 600; }
        #clock { text-align: right; font-weight: 400; }
        
        #stremio-link { opacity: 0; transition: all 0.5s ease; pointer-events: none; }
        #stremio-link.active { opacity: 0.9; pointer-events: auto; }
        #stremio-icon { width: 34px; height: 34px; vertical-align: middle; } 
    </style>
</head>
<body>

    <div id="banner-container" class="auto-hide">
        <div class="text-buffer-container" id="fs-trigger">
            <div id="title-1" class="title-layer" style="opacity:0">Now Playing</div>
            <div id="title-2" class="title-layer" style="opacity:0"></div>
        </div>
    </div>
    
    <div id="main-stage">
        <a id="poster-container" target="_blank" rel="noopener noreferrer" class="auto-hide">
            <div id="glow-1" class="glow" style="opacity:0"></div><div id="glow-2" class="glow" style="opacity:0"></div>
            <img id="poster-1" class="poster-layer" style="opacity:0" src="">
            <img id="poster-2" class="poster-layer" style="opacity:0" src="">
        </a>
    </div>
    
    <div id="footer" class="auto-hide">
        <div id="year"></div>
        <a id="stremio-link" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation();">
            <img id="stremio-icon" src="https://www.stremio.com/website/stremio-logo-small.png">
        </a>
        <div id="clock"></div>
    </div>

    <script>
        let wakeLock = null;

        // Function to keep the screen awake
        const requestWakeLock = async () => {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    console.log('Screen is kept awake');
                }
            } catch (err) {
                console.error(`${err.name}, ${err.message}`);
            }
        };

        // Re-acquire lock when the tab becomes visible again
        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                await requestWakeLock();
            }
        });

        const trigger = document.getElementById('fs-trigger');
        trigger.addEventListener('click', async () => {
            // 1. Request Full Screen
            if (!document.fullscreenElement) {
                if (document.documentElement.requestFullscreen) {
                    await document.documentElement.requestFullscreen();
                } else if (document.documentElement.webkitRequestFullscreen) {
                    await document.documentElement.webkitRequestFullscreen();
                }
            }
            // 2. Request Wake Lock
            await requestWakeLock();
        });

        const TRAKT_ID = 'deee6c021dcf4dce52a13aca68d5afd598630b053c1b2b596c4893e5ca04267b';
        const TMDB_KEY = 'f75c29f77477ec19bcb68556f5904458';
        const USERNAME = 'starmanrf';

        let currentMedia = { title: "", year: "", poster: "", traktUrl: "", type: "", imdb: "" };
        let recs = [];
        let isWatching = false;
        let rotationTimer = null;
        let activeLayer = 1;

        async function fetchTMDB(path) {
            const res = await fetch(`https://api.themoviedb.org/3/${path}?api_key=${TMDB_KEY}`);
            return await res.json();
        }

        async function fetchTraktRelated(traktId, type) {
            try {
                const endpoint = type === 'movie' ? 'movies' : 'shows';
                const res = await fetch(`https://api.trakt.tv/${endpoint}/${traktId}/related`, {
                    headers: { 'trakt-api-key': TRAKT_ID, 'trakt-api-version': '2' }
                });
                const data = await res.json();
                return data.map(item => item.show || item.movie || item).filter(item => !!item.ids.tmdb);
            } catch (e) { return []; }
        }

        function crossfade(url, label, year, link, imdbId, type) {
            if (!url) return;
            const nextLayer = activeLayer === 1 ? 2 : 1;
            const els = {
                nextImg: document.getElementById(`poster-${nextLayer}`),
                currImg: document.getElementById(`poster-${activeLayer}`),
                nextGlow: document.getElementById(`glow-${nextLayer}`),
                currGlow: document.getElementById(`glow-${activeLayer}`),
                nextTitle: document.getElementById(`title-${nextLayer}`),
                currTitle: document.getElementById(`title-${activeLayer}`)
            };
            els.nextImg.src = url;
            els.nextGlow.style.backgroundImage = `url(${url})`;
            els.nextTitle.innerText = label;
            document.getElementById('year').innerText = year || "";
            document.getElementById('poster-container').href = link || "#";
            
            if (imdbId) {
                const sType = type === 'movie' ? 'movie' : 'series';
                document.getElementById('stremio-link').href = `stremio://detail/${sType}/${imdbId}`;
                document.getElementById('stremio-link').classList.add('active');
            } else {
                document.getElementById('stremio-link').classList.remove('active');
            }

            els.nextImg.style.opacity = "1"; els.nextGlow.style.opacity = "0.25"; els.nextTitle.style.opacity = "1";
            els.currImg.style.opacity = "0"; els.currGlow.style.opacity = "0"; els.currTitle.style.opacity = "0";
            activeLayer = nextLayer;
            document.querySelectorAll('.auto-hide').forEach(el => el.style.opacity = "1");
        }

        async function startRotation() {
            if (rotationTimer) clearInterval(rotationTimer);
            rotationTimer = setInterval(async () => {
                if (!isWatching || recs.length === 0) return;
                const item = recs[Math.floor(Math.random() * recs.length)];
                const tmdbType = currentMedia.type === 'movie' ? 'movie' : 'tv';
                const detail = await fetchTMDB(`${tmdbType}/${item.ids.tmdb}`);
                if (detail.poster_path) {
                    const rLink = `https://app.trakt.tv/${currentMedia.type === 'movie' ? 'movies' : 'shows'}/${item.ids.slug}`;
                    const rPoster = `https://image.tmdb.org/t/p/original${detail.poster_path}`;
                    crossfade(rPoster, "You Might Like", item.year, rLink, item.ids.imdb, currentMedia.type);
                    setTimeout(() => {
                        if (isWatching) crossfade(currentMedia.poster, "Now Playing", currentMedia.year, currentMedia.traktUrl, currentMedia.imdb, currentMedia.type);
                    }, 15000); 
                }
            }, 60000); 
        }

        async function checkTrakt() {
            try {
                const res = await fetch(`https://api.trakt.tv/users/${USERNAME}/watching`, { headers: { 'trakt-api-key': TRAKT_ID, 'trakt-api-version': '2' } });
                if (res.status === 204) {
                    isWatching = false; 
                    document.querySelectorAll('.auto-hide').forEach(el => el.style.opacity = "0");
                    if (rotationTimer) clearInterval(rotationTimer); 
                    currentMedia.title = ""; return;
                }
                const data = await res.json();
                const media = data.movie || data.show;
                if (media.title !== currentMedia.title) {
                    isWatching = true;
                    currentMedia.title = media.title;
                    currentMedia.year = media.year;
                    currentMedia.type = data.type === 'movie' ? 'movie' : 'show';
                    currentMedia.imdb = media.ids.imdb;
                    currentMedia.traktUrl = `https://app.trakt.tv/${currentMedia.type === 'movie' ? 'movies' : 'shows'}/${media.ids.slug}`;
                    const detail = await fetchTMDB(`${currentMedia.type === 'movie' ? 'movie' : 'tv'}/${media.ids.tmdb}`);
                    currentMedia.poster = `https://image.tmdb.org/t/p/original${detail.poster_path}`;
                    crossfade(currentMedia.poster, "Now Playing", currentMedia.year, currentMedia.traktUrl, currentMedia.imdb, currentMedia.type);
                    recs = await fetchTraktRelated(media.ids.trakt, currentMedia.type);
                    startRotation();
                }
            } catch (e) {}
        }

        setInterval(checkTrakt, 10000);
        setInterval(() => { 
            document.getElementById('clock').innerText = new Date().toLocaleTimeString('en-GB', { 
                hour: '2-digit', 
                minute: '2-digit', 
                hour12: false 
            }); 
        }, 1000);
        checkTrakt();
    </script>
</body>
</html>
